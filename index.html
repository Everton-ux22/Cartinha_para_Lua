<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Mensagem Especial 💌</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fontes Google para dar um toque delicado -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 🎵 ÁUDIO MP3 DE FUNDO (Certifique-se de colocar o arquivo musica.mp3 na mesma pasta) -->
    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <!-- Botão de Música de Fundo (Canto Superior Direito) -->
    <button id="music-toggle" onclick="toggleAudio()">🎵 Música: Off</button>

    <!-- Canvas para efeito de chuva de corações -->
    <canvas id="canvas-particles"></canvas>

    <!-- TELA 1: ENVELOPE -->
    <div class="container" id="screen-envelope">
        <div class="envelope-wrapper" onclick="abrirCarta()">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="heart-seal">❤️</div>
            </div>
        </div>
        <p class="instruction-text">Clique no envelope para abrir 💌</p>
    </div>

    <!-- TELA 2: A CARTA -->
    <div class="container hidden" id="screen-letter">
        <div class="letter-card">
            <h1 class="letter-title">Para alguém muito especial ✨</h1>
            
            <!-- Texto digitado automaticamente -->
            <div class="letter-body" id="typed-text"></div>

            <!-- PERGUNTA FINAL -->
            <div class="question-box hidden" id="question-box">
                <h3>Promete guardar essa amizade para sempre?</h3>
                <div class="button-group">
                    <button class="btn btn-yes" onclick="aceitouAmizade()">Com certeza! 💖</button>
                    <button class="btn btn-no" id="btn-no" onmouseover="fugirBotao()" onclick="fugirBotao()">Não 😜</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
